[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
description = "A small, dependency-free maze generator and solver."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE.md" }
authors = [{ name = "syokota" }, { name = "atajima" }]
keywords = ["maze", "generator", "labyrinth", "42", "pacman"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment :: Puzzle Games",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/42/a-maze-ing"

[tool.setuptools]
packages = ["mazegen", "mazegen.generation", "mazegen.analysis"]

[tool.mypy]
python_version = "3.10"
exclude = ["build/", "\\.venv/", "venv/"]
